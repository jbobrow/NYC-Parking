name: Review prompt build check
on:
  push:
    branches: [review-prompt]
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: |
          ls /Applications | grep Xcode || true
          sudo xcode-select -s /Applications/Xcode_26.6.app || true
          xcodebuild -version
      - name: List schemes
        run: xcodebuild -list -project NYCParking/NYCParking.xcodeproj
      - name: Build (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild build -project NYCParking/NYCParking.xcodeproj -scheme NYCParking \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee build.log
      - name: Warnings
        if: always()
        run: grep -n "warning:" build.log | sort -u || true
