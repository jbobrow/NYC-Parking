# Keeps docs/data/holidays.json, which the website and the app both read, up
# to date with NYC DOT's alternate-side holiday calendar. Picks up next year's
# calendar on its own once DOT publishes it, usually late in the year.
name: Holiday calendar

on:
  schedule:
    - cron: "17 14 * * 1"   # Mondays, morning in New York
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/build_web_data.py --holidays-only
      - name: Commit if changed
        run: |
          git diff --quiet docs/data/holidays.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -m "Holiday calendar: update from NYC DOT" docs/data/holidays.json
          git push
