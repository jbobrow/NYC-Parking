<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NYC Parking</title>
  <meta name="description" content="Alternate-side parking rules for every block in New York City, color-coded by day, with alerts before you need to move. Free for iPhone.">
  <meta property="og:title" content="NYC Parking">
  <meta property="og:description" content="Alternate-side parking rules for every block in New York City, color-coded by day.">
  <meta property="og:image" content="https://nycparking.jonbobrow.com/icon.png">
  <meta name="theme-color" content="#121318">
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js" defer></script>
  <script src="main.js" defer></script>
</head>
<body>
  <main class="page">
    <header>
      <img class="app-icon" src="icon.png" width="256" height="256" alt="">
      <h1>NYC Parking</h1>
      <p class="tagline">Know before you park.</p>
    </header>

    <div class="stage">
      <div id="map" role="region" aria-label="Map of every block in the city, colored by days until street cleaning, starting in Clinton Hill, Brooklyn"></div>
      <div class="legend days" aria-hidden="true" hidden>
        <span class="d mon">MON</span><span class="d tue">TUE</span><span class="d wed">WED</span><span class="d thu">THU</span><span class="d fri">FRI</span><span class="d sat">SAT</span><span class="d sun">SUN</span>
      </div>
      <div class="legend countdown" aria-hidden="true">
        <span class="label">Days until move</span>
      </div>
      <div class="modes" role="group" aria-label="Map view">
        <button type="button" data-mode="days" aria-pressed="false">Cleaning days</button>
        <button type="button" data-mode="countdown" aria-pressed="true">Days until move</button>
      </div>
    </div>

    <p class="readout" id="readout" aria-live="polite">Loading every block in the city…</p>

    <a class="download" href="https://apps.apple.com/ca/app/nyc-parking-asp-map-alerts/id6762587893">Download for iPhone</a>

    <nav class="footer-links" aria-label="Footer links">
      <a href="privacy.html">Privacy policy</a>
      <a href="support.html">Support</a>
    </nav>
    <p class="made-by">Made by <a href="https://github.com/jbobrow">Jonathan Bobrow</a> · Sign data from <a href="https://opendata.cityofnewyork.us">NYC Open Data</a></p>
  </main>
</body>
</html>
